name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dingping-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile and test native arm64 App
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/DingPing-build"
          bash Scripts/build.sh "$RUNNER_TEMP/DingPing-build"
          app="$RUNNER_TEMP/DingPing-build/定屏.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = local.dingping.fixedsplit
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.5.7
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = 14
          test -x "$app/Contents/Resources/修复定屏授权.command"
          bash -n "$app/Contents/Resources/修复定屏授权.command"
          cmp Installer/repair_accessibility.command "$app/Contents/Resources/修复定屏授权.command"
          bash -n Installer/install_prebuilt.command
          bash -n Installer/repair_accessibility.command
          bash Tests/installer_policy_tests.sh
          file "$app/Contents/MacOS/DingPing"

      - name: Check repair tool cannot reset in noninteractive CI
        shell: bash
        run: |
          set -euo pipefail
          test_home="$RUNNER_TEMP/DingPing-repair-test"
          mkdir -p "$test_home/Applications"
          ditto "$RUNNER_TEMP/DingPing-build/定屏.app" "$test_home/Applications/定屏.app"
          set +e
          HOME="$test_home" bash Installer/repair_accessibility.command > "$RUNNER_TEMP/repair-test.log" 2>&1
          result=$?
          set -e
          test "$result" -eq 4
          cat "$RUNNER_TEMP/repair-test.log"

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/DingPing-dmg"
          mkdir -p "$staging/安装资源" dist
          ditto "$RUNNER_TEMP/DingPing-build/定屏.app" "$staging/安装资源/定屏.app"
          test -d "$staging/安装资源/定屏.app"
          test ! -e "$staging/定屏.app"
          cp Installer/install_prebuilt.command "$staging/双击安装预编译版.command"
          chmod 755 "$staging/双击安装预编译版.command"
          cp Installer/common.sh "$staging/.dingping-install.sh"
          cp Installer/repair_accessibility.command "$staging/双击修复定屏授权.command"
          chmod 755 "$staging/双击修复定屏授权.command"
          cat > "$staging/安装说明.txt" <<'GUIDE'
          定屏 v0.5.7（构建 14）· Apple Silicon DMG

          1. 在本 DMG 顶层双击“双击安装预编译版.command”；不要从“安装资源”直接运行 App。安装器会请求旧版退出，将
             /Applications/定屏.app 中经核对的旧副本移到废纸篓，
             替换个人 Applications 中的旧版，安装到 ~/Applications/定屏.app。
             若旧版无法退出或移除，请按终端提示处理后重试。
          2. 更新签名后安装器会引导你处理旧版辅助功能授权。
          3. 若安装后仍显示等待授权，双击“双击修复定屏授权.command”。
             它会核对新版本，仅重置定屏自己的授权记录，然后引导你手动移除旧条目，
             从个人 Applications 重新添加当前 App 并开启开关。

          这份程序使用临时签名，没有 Apple Developer ID 公证；macOS 可能提示需要手动确认打开。
          已装好同一个构建时安装器不会反复替换或签名。
          仅移除经核对应用标识的旧程序，不清除布局和偏好设置。
          如权限诊断显示 /AppTranslocation/，说明启动的是隔离的临时副本；请退出并重新运行顶层安装器。
          GUIDE
          dmg="$GITHUB_WORKSPACE/dist/DingPing-v0.5.7-macOS-arm64.dmg"
          hdiutil create -volname '定屏 v0.5.7' -srcfolder "$staging" -format UDZO -ov "$dmg"
          verified=0
          for attempt in 1 2 3 4 5; do
            if hdiutil verify "$dmg"; then verified=1; break; fi
            echo "DMG 校验暂未完成（第 $attempt 次），三秒后重试。" >&2
            sleep 3
          done
          test "$verified" -eq 1
          ( cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256" )

      - name: Upload download artifact
        uses: actions/upload-artifact@v4
        with:
          name: DingPing-v0.5.7-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish first successful v0.5.7 build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.5.7
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Keep its signed DMG unchanged; this run is available as an Actions artifact."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          定屏 v0.5.7（构建 14），适用于 Apple Silicon Mac，要求 macOS 13 或更新版本。

          修复拖动起点无法识别：根据鼠标下最前面的屏幕窗口，匹配可操作的辅助功能窗口，允许屏幕与辅助功能的窗口边界有差异；诊断区分屏幕窗口、匹配与标题区域问题。固定窗口和固定分区仍受保护。

          下载 DMG 后双击顶层的安装脚本，不要直接打开“安装资源”中的 App。临时运行时会提醒先安装。它会请求旧版退出，替换个人 Applications 中的旧版，并将 /Applications 中经核对的旧副本移到废纸篓；布局设置保留。如果旧版本签名与本版不同，安装脚本会直接引导你修复授权；DMG 内另附“双击修复定屏授权.command”，应用中也有修复入口。只重置定屏的记录，系统开关仍需用户本人操作。

          此 DMG 经 GitHub 的 macOS ARM64 runner 编译、运行核心测试并校验签名与磁盘映像；没有 Developer ID 签名或 Apple 公证，实际窗口行为仍需在用户 Mac 上验证。不同构建的临时签名可能需要重新授权。
          NOTES
          gh release create "$tag" dist/*.dmg dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title '定屏 v0.5.7 · macOS Apple Silicon DMG' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
