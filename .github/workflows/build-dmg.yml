name: Build macOS DMG

on:
  push:
    branches: [main, rework-window-stacks-v0.8.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dingping-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile and test native arm64 App
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/DingPing-build"
          bash Scripts/build.sh "$RUNNER_TEMP/DingPing-build"
          app="$RUNNER_TEMP/DingPing-build/定屏.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = local.dingping.fixedsplit
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.8.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = 20
          test -x "$app/Contents/Resources/修复定屏授权.command"
          bash -n "$app/Contents/Resources/修复定屏授权.command"
          cmp Installer/repair_accessibility.command "$app/Contents/Resources/修复定屏授权.command"
          bash -n Installer/install_prebuilt.command
          bash -n Installer/repair_accessibility.command
          bash -n Installer/pkg_preinstall
          bash -n Installer/pkg_postinstall
          bash Tests/installer_policy_tests.sh
          file "$app/Contents/MacOS/DingPing"

      - name: Render fixed-size interface for review
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/DingPing-ui"
          "$RUNNER_TEMP/DingPing-build/定屏.app/Contents/MacOS/DingPing" --render-ui "$RUNNER_TEMP/DingPing-ui"
          test -s "$RUNNER_TEMP/DingPing-ui/DingPing-layouts.png"
          test -s "$RUNNER_TEMP/DingPing-ui/DingPing-settings.png"

      - name: Upload interface previews
        uses: actions/upload-artifact@v4
        with:
          name: DingPing-v0.8.0-interface
          path: ${{ runner.temp }}/DingPing-ui/*.png

      - name: Check repair tool cannot reset in noninteractive CI
        shell: bash
        run: |
          set -euo pipefail
          test_home="$RUNNER_TEMP/DingPing-repair-test"
          mkdir -p "$test_home/Applications"
          ditto "$RUNNER_TEMP/DingPing-build/定屏.app" "$test_home/Applications/定屏.app"
          set +e
          HOME="$test_home" bash Installer/repair_accessibility.command > "$RUNNER_TEMP/repair-test.log" 2>&1
          result=$?
          set -e
          test "$result" -eq 4
          cat "$RUNNER_TEMP/repair-test.log"

      - name: Create graphical PKG installer
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/DingPing-payload"
          scripts="$RUNNER_TEMP/DingPing-pkg-scripts"
          mkdir -p "$payload/Applications" "$scripts" dist
          ditto "$RUNNER_TEMP/DingPing-build/定屏.app" "$payload/Applications/定屏.app"
          cp Installer/pkg_preinstall "$scripts/preinstall"
          cp Installer/pkg_postinstall "$scripts/postinstall"
          chmod 755 "$scripts/preinstall" "$scripts/postinstall"
          component="$RUNNER_TEMP/DingPing-component.plist"
          pkgbuild --analyze --root "$payload" "$component"
          /usr/bin/python3 - "$component" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as source:
              bundles = plistlib.load(source)
          assert len(bundles) == 1
          bundles[0]['BundleIsRelocatable'] = False
          with open(path, 'wb') as target:
              plistlib.dump(bundles, target)
          PY
          pkg="$GITHUB_WORKSPACE/dist/DingPing-v0.8.0-macOS-arm64.pkg"
          pkgbuild --root "$payload" --install-location / --ownership recommended \
            --component-plist "$component" \
            --identifier local.dingping.fixedsplit.installer --version 0.8.0 \
            --scripts "$scripts" "$pkg"
          pkgutil --payload-files "$pkg" | grep -F 'Applications/定屏.app/Contents/MacOS/DingPing'
          expanded="$RUNNER_TEMP/DingPing-pkg-expanded"
          pkgutil --expand "$pkg" "$expanded"
          test -e "$expanded/Scripts"
          shasum -a 256 "$pkg" > "$pkg.sha256"

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/DingPing-dmg"
          mkdir -p "$staging/.安装资源" "$staging/高级安装" dist
          ditto "$RUNNER_TEMP/DingPing-build/定屏.app" "$staging/.安装资源/定屏.app"
          test -d "$staging/.安装资源/定屏.app"
          test ! -e "$staging/定屏.app"
          cp dist/DingPing-v0.8.0-macOS-arm64.pkg "$staging/双击安装定屏.pkg"
          cp Installer/install_prebuilt.command "$staging/高级安装/双击安装预编译版.command"
          chmod 755 "$staging/高级安装/双击安装预编译版.command"
          cp Installer/common.sh "$staging/.dingping-install.sh"
          cp Installer/repair_accessibility.command "$staging/高级安装/双击修复定屏授权.command"
          chmod 755 "$staging/高级安装/双击修复定屏授权.command"
          cat > "$staging/安装说明.txt" <<'GUIDE'
          定屏 v0.8.0（构建 20）· Apple Silicon DMG

          1. 请先从菜单栏退出定屏，再双击“双击安装定屏.pkg”，按图形界面安装。
             新版安装到 /Applications/定屏.app。已验证的个人 Applications 旧副本
             在新版校验通过后移到废纸篓，布局配置保留，旧程序压缩备份保留。
          2. 从 /Applications 启动定屏。若新版显示等待辅助功能授权，
             在定屏里点“修复旧版授权”，手动从系统列表移除旧条目并添加当前路径。
          3. “高级安装”中保留原命令行安装与授权修复工具，供需要时使用。

          这份 App 使用临时签名，安装包未做 Apple Developer ID 公证；
          macOS 可能要求在 Finder 中按住 Control 点击安装包并选“打开”。
          如诊断路径显示 /AppTranslocation/，请退出临时副本，运行安装包。
          GUIDE
          dmg="$GITHUB_WORKSPACE/dist/DingPing-v0.8.0-macOS-arm64.dmg"
          hdiutil create -volname '定屏 v0.8.0' -srcfolder "$staging" -format UDZO -ov "$dmg"
          verified=0
          for attempt in 1 2 3 4 5; do
            if hdiutil verify "$dmg"; then verified=1; break; fi
            echo "DMG 校验暂未完成（第 $attempt 次），三秒后重试。" >&2
            sleep 3
          done
          test "$verified" -eq 1
          ( cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256" )

      - name: Upload download artifact
        uses: actions/upload-artifact@v4
        with:
          name: DingPing-v0.8.0-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish first successful v0.8.0 build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.8.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Keep its signed DMG unchanged; this run is available as an Actions artifact."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          定屏 v0.8.0（构建 20），适用于 Apple Silicon Mac，要求 macOS 13 或更新版本。

          本版重构为按窗口记忆分区、每格多窗口叠放：点击已有窗口只置前，手动拖动更新归属并置顶，目标格原窗口保留在下层；关闭或最小化栈顶时显示本格下层窗口。

          各内置布局和常用方案独立记忆。主界面顶部保存常用方案、一键切换；保存比例、间距、显示器、各窗分区和叠放顺序，可另存、重命名、删除。拖动交易优先于后台归位和布局切换，旧回调失效。配置先备份 layouts-before-0.8.0.json，再迁移到版本 4，保留旧固定与占位记录。

          默认新窗口叠放当前分区，切换不恢复最小化。固定位置不代表永久置顶，手动拖动可更新；禁止标题栏拖动是独立设置。运行期间用活窗口身份，重启只用唯一文档/标题恢复，同名不猜。

          测试覆盖两个 Chrome 反复点击、五窗三格叠放、左右/上下拖放、拖动抢占布局和过期回调、最小化后露出下层、方案独立保存与重启、迁移备份、损坏配置保留。原生界面已离屏渲染核对；真实 macOS 26 鼠标拖放和焦点效果仍待用户实机验证。

          可直接下载 .pkg，双击后按图形界面安装；DMG 双击只会挂载，再双击其中的“双击安装定屏.pkg”。安装到 /Applications，已验证的 ~/Applications 旧副本在新版核验通过后移到废纸篓，布局设置保留。若辅助功能开关绑定了旧路径，请在应用内按提示重新添加 /Applications/定屏.app。

          App 和图形安装包由 GitHub 的 macOS ARM64 runner 构建，运行核心测试并校验应用签名与磁盘映像；没有 Developer ID 签名或 Apple 公证，实际窗口拖放和 macOS 26 行为仍需在用户 Mac 上验证。不同构建的临时签名可能需要重新授权。
          NOTES
          gh release create "$tag" dist/*.dmg dist/*.pkg dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title '定屏 v0.8.0 · macOS Apple Silicon DMG' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
